<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福盛世家（添翼版）终身寿险 · 利益演示计算器</title>
<style>
  :root{
    --blue:#1E3A5F; --blue2:#2C5282; --gray:#64748B; --graybg:#F1F5F9;
    --line:#E2E8F0; --accent:#2563EB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1E293B;padding:16px;}
  .wrap{max-width:1080px;margin:0 auto;}
  .title-bar{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px;}
  .title-bar h1{font-size:22px;font-weight:700;}
  .title-bar p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5;}
  .card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;color:var(--gray);font-weight:600;}
  .gender-group{display:flex;gap:8px;}
  .gender-btn{padding:9px 20px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--gray);}
  .gender-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;width:130px;}
  .btn{padding:11px 26px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#1D4ED8;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-dl{background:#8B1A1A;margin-left:10px;}
  .btn-dl:hover{background:#7A1515;}
  #paramBar{display:none;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:14px;}
  #paramBar span{background:var(--graybg);padding:5px 12px;border-radius:20px;font-weight:600;color:var(--blue);}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:15px;min-width:860px;}
  thead th{background:#1E3A8A;color:#fff;padding:11px 10px;text-align:center;font-weight:700;font-size:14px;position:sticky;top:0;}
  thead th[colspan],thead th[rowspan]{vertical-align:middle;}
  tbody td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);}
  tbody tr.row-5y{background:#DBEAFE;}
  tbody tr.row-last{background:#BFDBFE;}
  tbody tr.row-5y td, tbody tr.row-last td{background:transparent;}
  .side-label{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:8px;font-size:14px;font-weight:700;color:#1E3A8A;text-align:center;padding:10px 4px;background:#DBEAFE;border:1px solid #93C5FD;}
  .pay-merge{vertical-align:middle;text-align:center;color:#94A3B8;font-weight:600;}
  .err{display:none;background:#FEE2E2;color:#B91C1C;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600;}
  .err.show{display:block;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;font-size:14px;z-index:99;}
  .toast.show{opacity:1;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:98;}
  .overlay.show{display:flex;}
  .overlay div{background:#fff;padding:22px 34px;border-radius:12px;font-size:16px;font-weight:600;}
  canvas{display:none;}
  .tip{font-size:12px;color:var(--gray);margin-top:8px;}
  .back-link{display:inline-block;margin-bottom:10px;color:#fff;opacity:.9;font-size:13px;text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  @media (max-width:768px){
    body{padding:10px;}
    .title-bar h1{font-size:18px;}
    .form-row{flex-direction:column;align-items:stretch;}
    .field{width:100%;}
    input,select{width:100%;}
    table{font-size:13px;min-width:760px;}
    thead th{font-size:12px;padding:9px 4px;}
    tbody td{padding:8px 4px;}
  }
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回资料库</a>
<div class="wrap">
  <div class="title-bar">
    <h1>福盛世家（添翼版）终身寿险 · 利益演示计算器</h1>
    <p>新华保险 · 终身寿险（非分红型）。输入被保人信息，自动演算各保单年度现金价值、身价保障（身故/全残、特定公共交通意外）等利益。前5年为储备期。</p>
  </div>

  <div class="card">
    <div class="form-row">
      <div class="field">
        <label>性别</label>
        <div class="gender-group">
          <div class="gender-btn" data-value="0" onclick="selectGender(this)">男</div>
          <div class="gender-btn active" data-value="1" onclick="selectGender(this)">女</div>
        </div>
      </div>
      <div class="field">
        <label>投保年龄（周岁）</label>
        <input id="age" type="number" value="40" min="0" max="72">
      </div>
      <div class="field">
        <label>交费方式</label>
        <select id="term">
          <option value="1">一次交清</option>
          <option value="3" selected>3年交</option>
          <option value="5">5年交</option>
          <option value="10">10年交</option>
        </select>
      </div>
      <div class="field">
        <label>年交保费（元）</label>
        <input id="premium" type="number" value="1000000" min="1000" step="1000">
      </div>
      <div class="field">
        <label>显示密度</label>
        <select id="displayMode" onchange="if(typeof filterRowsByAge==='function'){filterRowsByAge(this.value);}">
          <option value="all">显示全部</option>
          <option value="2y">60岁起每2年一行</option>
          <option value="5y" selected>60岁起每5年一行</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="btnGenerate" onclick="generate()">生成利益演示</button>
      </div>
    </div>
    <div class="tip">默认演示：女40周岁 / 3年交 / 年交100万元。非分红型，固定收益保证利益。</div>
  </div>

  <div class="err" id="errorMsg"></div>
  <div id="paramBar"></div>

  <div class="card">
    <div style="display:flex;align-items:center;margin-bottom:10px;">
      <button class="btn btn-dl" onclick="downloadImage()">下载演算图片</button>
      <span class="tip" style="margin:0 0 0 12px;">导出含完整演算表的计划书图片</span>
    </div>
    <div class="table-scroll">
      <table id="resultTable">
        <thead>
          <tr class="group-header">
            <th rowspan="2">保单年度</th><th rowspan="2">年龄</th><th rowspan="2">当年保费</th><th rowspan="2">累计保费</th>
            <th colspan="2">身价保障</th><th rowspan="2">现金价值</th><th rowspan="2">阶段</th>
          </tr>
          <tr class="sub-header">
            <th>一般身故/全残</th><th>特定公共交通意外</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>
<div style="text-align:center;padding:16px;font-size:12px;color:#64748B;line-height:1.8;">
  本页面及演示说明仅供内部保险从业人员学习、交流使用，数据仅供参考，<br>
  具体应以保单条款及保险合同为准。
</div>

<canvas id="renderCanvas"></canvas>
<div class="overlay" id="loadingOverlay"><div>生成中...</div></div>
<div class="toast" id="toast"></div>

<script src="fusheng_calcdata.js"></script>
<script>
let currentGender = 1; // 默认女

function selectGender(el){
  document.querySelectorAll('.gender-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentGender = parseInt(el.dataset.value);
}

function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
}
function showLoading(s){document.getElementById('loadingOverlay').classList.toggle('show',s);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '-';
  return Math.round(n).toLocaleString('zh-CN');
}

async function generate(){
  const btn=document.getElementById('btnGenerate');
  btn.disabled=true; btn.textContent='计算中...';
  try{
    const age=parseInt(document.getElementById('age').value);
    const term=parseInt(document.getElementById('term').value);
    const premium=parseInt(document.getElementById('premium').value);
    if(isNaN(age)||age<0||age>72){showError('投保年龄须在0~72周岁');btn.disabled=false;btn.textContent='生成利益演示';return;}
    if(isNaN(premium)||premium<(term===1?10000:1000)||premium%1000!==0){showError('保费须为1,000元整数倍（一次交清最低10,000元）');btn.disabled=false;btn.textContent='生成利益演示';return;}
    const maxAgeMap={0:{1:68,3:68,5:67,10:65},1:{1:72,3:72,5:70,10:65}};
    const maxAge=(maxAgeMap[currentGender]&&maxAgeMap[currentGender][term])||65;
    if(age>maxAge){showError(`该交费方式最高投保年龄为${maxAge}周岁`);btn.disabled=false;btn.textContent='生成利益演示';return;}

    const key=`${currentGender}_${age}_${term}`;
    const entry=CALC_DATA_INLINE[key];
    if(!entry){showError('未找到该参数组合的数据，请检查输入');btn.disabled=false;btn.textContent='生成利益演示';return;}

    const scale=premium/1000;
    const sumAssured=Math.round(entry.E*scale);
    const years=entry.y;
    const genderLabel=currentGender===0?'男':'女';
    const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];
    document.getElementById('paramBar').style.display='flex';
    document.getElementById('paramBar').innerHTML=
      `<strong style="color:#1E3A8A;font-size:16px;">${age}岁${genderLabel}士</strong><strong style="color:#1E3A8A;font-size:16px;">每年${fmt(premium)}</strong><strong style="color:#1E3A8A;font-size:16px;">${termLabel}</strong><span style="color:#64748B;">非分红型</span>`;

    const body=document.getElementById('resultBody');
    body.innerHTML='';
    const paymentYears=term;
    const maxYear=years.length;
    let isFirstPay=true;

    years.forEach((row,idx)=>{
      const yr=row[0], prem=row[1], cum=row[2], cash=row[3];
      const curAge=age+yr-1;
      const isPayYear=yr<=paymentYears;
      const is5y=yr>=5 && yr%5===0;
      const isLast=(idx===years.length-1);
      const rowClass=isLast?'row-last':(is5y?'row-5y':'');
      const tr=document.createElement('tr');
      if(rowClass) tr.className=rowClass;

      const currentSA=Math.round(sumAssured*Math.pow(1.02,yr-1));
      const K=curAge<41?1.6:(curAge<=60?1.4:1.2);
      const deathGeneral=Math.max(Math.round(cash*scale),Math.round(cum*scale*K),currentSA);
      const deathPublic=currentSA;

      let cells=`<td>${yr}</td><td>${curAge}</td>`;
      if(isFirstPay){
        if(paymentYears>1){
          cells+=`<td class="pay-merge" rowspan="${paymentYears}">${fmt(prem*scale)}<br><span style="font-size:11px;color:#94A3B8;">缴费期分${paymentYears}年投入</span></td>`;
        } else {
          cells+=`<td>${fmt(prem*scale)}</td>`;
        }
        isFirstPay=false;
      } else if(!isPayYear){
        cells+=`<td>-</td>`;
      }
      cells+=`<td>${fmt(cum*scale)}</td>`;
      cells+=`<td>${fmt(deathGeneral)}</td><td>${fmt(deathPublic)}</td>`;
      cells+=`<td>${fmt(cash*scale)}</td>`;
      if(yr===1){
        cells+=`<td class="side-label" rowspan="${paymentYears}">不再缴费</td>`;
      } else if(yr===paymentYears+1){
        const longTermRowspan=maxYear-paymentYears;
        if(longTermRowspan>0) cells+=`<td class="side-label" rowspan="${longTermRowspan}">长期收益</td>`;
      }
      tr.innerHTML=cells;
      body.appendChild(tr);
    });
    // 应用显示密度过滤
    if(typeof filterRowsByAge==='function'){ filterRowsByAge(window.getDisplayMode?window.getDisplayMode():'5y'); }
  }catch(e){showError('生成出错：'+e.message);}
  btn.disabled=false; btn.textContent='生成利益演示';
}

function downloadImage(){
  const age=parseInt(document.getElementById('age').value);
  const term=parseInt(document.getElementById('term').value);
  const premium=parseInt(document.getElementById('premium').value);
  const key=`${currentGender}_${age}_${term}`;
  const entry=CALC_DATA_INLINE[key];
  if(!entry){showToast('请先生成表格');return;}

  const scale=premium/1000;
  const sumAssured=Math.round(entry.E*scale);
  const years=entry.y;
  const reserveYears=5;

  const genderLabel=currentGender===0?'男':'女';
  const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];

  // —— 数据逻辑保持原样（不改动 generate 的结果语义）——
  const dlRows=[];
  years.forEach(row=>{
    const yr=row[0],prem=row[1]*scale,cum=row[2]*scale,cash=row[3]*scale;
    const curAge=age+yr-1;
    // 下载默认5年模式：60岁起每5年一行
    if(curAge>=60&&(curAge-60)%5!==0)return;
    const currentSA=Math.round(sumAssured*Math.pow(1.02,yr-1));
    const K=curAge<41?1.6:(curAge<=60?1.4:1.2);
    const deathGeneral=Math.max(Math.round(cash),Math.round(cum*K),currentSA);
    const deathPublic=currentSA;
    dlRows.push({yr,age:curAge,prem,cum,cash,deathGeneral,deathPublic,reserve:yr<=reserveYears});
  });

  // —— 画布与统一布局尺寸（参照规范 P6 / 宏泰·恒享风格）——
  const canvas=document.getElementById('renderCanvas');
  const ctx=canvas.getContext('2d');
  const colWidths=[70,62,120,136,140,140,154,90];           // 8列：保单年度|年龄|当年保费|累计保费|一般身故/全残|特定公共交通意外|现金价值|储备期
  const totalW=colWidths.reduce((a,b)=>a+b,0);
  const rowH=42, headerH=72; // 表头两行（分组头+子列头）
  const titleH=80, infoH=130, paramH=52, subHdrH=40, footerH=44, pad=22;
  const tableH=headerH+dlRows.length*rowH;
  const canvasW=totalW+pad*2;
  const canvasH=titleH+infoH+paramH+subHdrH+tableH+10+16+10;   // 10=footer前距(紧贴), 16=1行文字高, 10=底留白

  const dpr=2;
  canvas.width=Math.round(canvasW*dpr); canvas.height=Math.round(canvasH*dpr);
  canvas.style.width=canvasW+'px'; canvas.style.height=canvasH+'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,canvasW,canvasH);

  // —— 标题栏（蓝渐变）——
  const grad=ctx.createLinearGradient(0,0,canvasW,0);
  grad.addColorStop(0,'#1D4ED8');grad.addColorStop(0.5,'#2563EB');grad.addColorStop(1,'#1E40AF');
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvasW,titleH);
  ctx.fillStyle='#FFFFFF'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('福盛世家（添翼版）终身寿险 · 利益演示计划书', canvasW/2, 32);
  ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('新华保险 · 终身寿险（非分红型）· 固定收益保证利益', canvasW/2, 60);

  // 圆角矩形辅助
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();}

  // —— 公司介绍区（左右栏）——
  const infoY=titleH+4, colGap=24, infoColW=(canvasW-pad*2-colGap)/2;
  // 左：公司背景
  ctx.fillStyle='#EFF6FF'; rr(pad,infoY,infoColW,infoH-6,6);
  ctx.fillStyle='#1D4ED8'; ctx.font='bold 17px "PingFang SC",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('★ 公司背景', pad+12, infoY+20);
  const compLines=[
    '新华保险成立于1996年9月人民大会堂',
    '国有控股上市险企 A+H股同步上市',
    '惠誉国际评级A级',
    '服务网络覆盖全国1700余家机构'
  ];
  ctx.fillStyle='#334155'; ctx.font='14px "PingFang SC",sans-serif';
  compLines.forEach((l,i)=>{ctx.fillText(l, pad+12, infoY+42+i*18);});

  // 右：产品特点
  const rx=pad+infoColW+colGap;
  ctx.fillStyle='#FFF7ED'; rr(rx,infoY,infoColW,infoH-6,6);
  ctx.fillStyle='#C2410C'; ctx.font='bold 17px "PingFang SC",sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('★ 产品特点', rx+12, infoY+20);
  const prodLines=[
    '福盛世家添翼版 终身寿险(非分红型)',
    '固定收益保证利益',
    '现金价值写入合同逐年增长',
    '身故保障:现金价值较大者',
    '可减保可贷现价80%'
  ];
  ctx.fillStyle='#334155'; ctx.font='14px "PingFang SC",sans-serif';
  prodLines.forEach((l,i)=>{ctx.fillText(l, rx+12, infoY+42+i*18);});

  // —— 参数栏（浅蓝底）——
  const paramY=infoY+infoH;
  const totalP=premium*(term===1?1:term);
  ctx.fillStyle='#DBEAFE'; ctx.fillRect(pad,paramY,canvasW-pad*2,paramH);
  ctx.fillStyle='#1E293B'; ctx.font='bold 15px "PingFang SC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`性别 ${genderLabel}  年龄 ${age}周岁  ${termLabel}  年缴保费 ${fmt(premium)}元  基本保额 ${fmt(sumAssured)}元  保险期间 终身  固收型(非分红)`, canvasW/2, paramY+paramH/2);

  // —— 子标题栏 ——
  const sHdrY=paramY+paramH;
  ctx.fillStyle='#1D4ED8'; ctx.fillRect(pad,sHdrY,canvasW-pad*2,subHdrH);
  ctx.fillStyle='#FFF'; ctx.font='bold 20px "PingFang SC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('利 益 演 示 表', canvasW/2, sHdrY+subHdrH/2);

  // —— 表头（深蓝，两行：分组头 + 子列头）——
  const tblX=pad, tblY=sHdrY+subHdrH;
  const topHeaderH=38, subHeaderH=34;
  // 分组头
  ctx.fillStyle='#1E3A5F'; ctx.fillRect(tblX,tblY,totalW,topHeaderH);
  const groupHdrs=[
    {t:'保单年度',w:colWidths[0]},
    {t:'年龄',w:colWidths[1]},
    {t:'当年保费',w:colWidths[2]},
    {t:'累计保费',w:colWidths[3]},
    {t:'身价保障',w:colWidths[4]+colWidths[5]},
    {t:'现金价值',w:colWidths[6]},
    {t:'储备期',w:colWidths[7]}
  ];
  ctx.fillStyle='#FFF'; ctx.font='bold 15px "PingFang SC",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  let cx=tblX+4; groupHdrs.forEach(h=>{
    ctx.fillText(h.t, cx+h.w/2, tblY+topHeaderH/2);
    // 分组头分隔线
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=0.5; ctx.beginPath();
    ctx.moveTo(cx+h.w,tblY); ctx.lineTo(cx+h.w,tblY+topHeaderH); ctx.stroke();
    cx+=h.w;
  });
  // 分组头与子列头之间的分隔线
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(tblX,tblY+topHeaderH); ctx.lineTo(tblX+totalW,tblY+topHeaderH); ctx.stroke();
  // 子列头
  const subY=tblY+topHeaderH;
  const subX0=tblX+4+colWidths[0]+colWidths[1]+colWidths[2]+colWidths[3];
  ctx.fillStyle='#334155'; ctx.fillRect(subX0,subY,colWidths[4]+colWidths[5],subHeaderH);
  const subHdrs=['一般身故/全残','特定公共交通意外'];
  let subX=subX0;
  ctx.fillStyle='#FFF'; ctx.font='bold 14px "PingFang SC",sans-serif';
  subHdrs.forEach((h,i)=>{
    ctx.fillText(h, subX+colWidths[4+i]/2, subY+subHeaderH/2);
    // 子列头分隔线
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=0.5; ctx.beginPath();
    ctx.moveTo(subX+colWidths[4+i],subY); ctx.lineTo(subX+colWidths[4+i],subY+subHeaderH); ctx.stroke();
    subX+=colWidths[4+i];
  });

  // —— 表格数据行 ——
  const reserveColXStart = tblX + colWidths.slice(0,7).reduce((a,b)=>a+b,0);
  const reserveColXEnd   = reserveColXStart + colWidths[7];
  let reserveCellX=0;
  dlRows.forEach((r,idx)=>{
    const y=tblY+headerH+idx*rowH;
    ctx.fillStyle=idx%2===0?'#FFFFFF':'#F0F9FF';
    ctx.fillRect(tblX,y,totalW,rowH);
    // 行分隔线：储备期块内断开（不穿过合并单元格）
    ctx.strokeStyle='#E2E8F0'; ctx.lineWidth=0.5; ctx.beginPath();
    if(r.reserve){
      ctx.moveTo(tblX,y+rowH); ctx.lineTo(reserveColXStart,y+rowH);
      ctx.moveTo(reserveColXEnd,y+rowH); ctx.lineTo(tblX+totalW,y+rowH);
    } else {
      ctx.moveTo(tblX,y+rowH); ctx.lineTo(tblX+totalW,y+rowH);
    }
    ctx.stroke();

    const vals=[
      {t:r.yr,c:'#1E293B',f:'bold 16px PingFang SC'},
      {t:r.age,c:'#334155',f:'16px PingFang SC'},
      {t:r.prem>0?fmt(r.prem):'-',c:'#334155',f:'15px PingFang SC'},
      {t:fmt(r.cum),c:'#334155',f:'15px PingFang SC'},
      {t:fmt(r.deathGeneral),c:'#1E3A5F',f:'bold 15px PingFang SC'},
      {t:fmt(r.deathPublic),c:'#1E3A5F',f:'bold 15px PingFang SC'},
      {t:fmt(r.cash),c:'#1E40AF',f:'bold 16px PingFang SC'},
      {t:'',c:'#94A3B8',f:'15px PingFang SC'}
    ];
    let cellX=tblX+4;
    vals.forEach((v,i)=>{
      const px=cellX+colWidths[i]/2;
      ctx.fillStyle=v.c; ctx.font=v.f; ctx.textAlign='center'; ctx.textBaseline='middle';
      if(r.reserve && i===7){ reserveCellX=px; }   // 储备期列留空，记录列中心
      else { ctx.fillText(String(v.t), px, y+rowH/2); }
      cellX+=colWidths[i];
    });
  });

  // —— 储备期合并单元格（两阶段：先在所有行背景之上填充，再描边+居中文字）——
  const reserveRows=dlRows.filter(r=>r.reserve);
  if(reserveRows.length>0 && reserveCellX>0){
    const y0=tblY+headerH;
    const blockH=reserveRows.length*rowH;
    ctx.fillStyle='#F1F5F9';
    ctx.fillRect(reserveColXStart, y0, colWidths[7], blockH);
    ctx.strokeStyle='#CBD5E1'; ctx.lineWidth=1;
    ctx.strokeRect(reserveColXStart+0.5, y0+0.5, colWidths[7]-1, blockH-1);
    ctx.fillStyle='#94A3B8'; ctx.font='bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('储备期', reserveCellX, y0+blockH/2);
  }

  // —— 页脚声明 ——
  const ftY=tblY+headerH+dlRows.length*rowH+10;   // footer紧贴表格
  ctx.fillStyle='#94A3B8'; ctx.font='12px PingFang SC'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('本计划书基于保证利益（非分红型）演算，现金价值写入合同逐年增长，仅供产品利益参考，具体以保险合同为准', canvasW/2, ftY);

  // —— 导出（toDataURL + <a download>，微信X5可弹窗）——
  const dataUrl=canvas.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=dataUrl;
  a.download=`福盛世家利益演示_${genderLabel}${age}岁${termLabel}_保费${fmt(premium)}元.png`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('计划书已下载');
  // 浏览器打开提示
  if(typeof showBrowserOpenPrompt==='function'){ try{ showBrowserOpenPrompt(dataUrl, `福盛世家利益演示_${genderLabel}${age}岁${termLabel}_保费${fmt(premium)}元.png`); }catch(e){} }
}

// 初始化
try{generate();}catch(e){console.error('init:',e);var _b=document.getElementById('btnGenerate');if(_b){_b.disabled=false;_b.textContent='生成利益演示';}}
</script>

<script src="ai-planner.js"></script>
</body>
