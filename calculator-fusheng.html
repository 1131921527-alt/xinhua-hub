<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福盛世家（添翼版）终身寿险 · 利益演示计算器</title>
<style>
  :root{
    --blue:#1E3A5F; --blue2:#2C5282; --gray:#64748B; --graybg:#F1F5F9;
    --headerbg:#334155; --rowalt:#F0F9FF; --line:#E2E8F0; --accent:#2563EB;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1E293B;padding:16px;}
  .wrap{max-width:1080px;margin:0 auto;}
  .title-bar{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px;}
  .title-bar h1{font-size:22px;font-weight:700;}
  .title-bar p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5;}
  .card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;color:var(--gray);font-weight:600;}
  .gender-group{display:flex;gap:8px;}
  .gender-btn{padding:9px 20px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--gray);}
  .gender-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;width:130px;}
  .btn{padding:11px 26px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#1D4ED8;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-dl{background:#059669;margin-left:10px;}
  .btn-dl:hover{background:#047857;}
  #paramBar{display:none;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:14px;}
  #paramBar span{background:var(--graybg);padding:5px 12px;border-radius:20px;font-weight:600;color:var(--blue);}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:15px;min-width:720px;}
  thead th{background:var(--headerbg);color:#fff;padding:11px 10px;text-align:center;font-weight:700;font-size:14px;position:sticky;top:0;}
  tbody td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);}
  tbody td:first-child,tbody td:nth-child(2){text-align:center;}
  tbody tr:nth-child(even){background:var(--rowalt);}
  .rate-reserve{background:#F1F5F9 !important;color:#94A3B8;font-weight:700;text-align:center;vertical-align:middle;}
  .err{display:none;background:#FEE2E2;color:#B91C1C;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600;}
  .err.show{display:block;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;font-size:14px;z-index:99;}
  .toast.show{opacity:1;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:98;}
  .overlay.show{display:flex;}
  .overlay div{background:#fff;padding:22px 34px;border-radius:12px;font-size:16px;font-weight:600;}
  canvas{display:none;}
  .tip{font-size:12px;color:var(--gray);margin-top:8px;}
  .back-link{display:inline-block;margin-bottom:10px;color:#fff;opacity:.9;font-size:13px;text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回资料库</a>
<div class="wrap">
  <div class="title-bar">
    <h1>福盛世家（添翼版）终身寿险 · 利益演示计算器</h1>
    <p>新华保险 · 终身寿险（非分红型）。输入被保人信息，自动演算各保单年度现金价值、基本保额等利益。前5年为储备期。</p>
  </div>

  <div class="card">
    <div class="form-row">
      <div class="field">
        <label>性别</label>
        <div class="gender-group">
          <div class="gender-btn active" data-value="0" onclick="selectGender(this)">男</div>
          <div class="gender-btn" data-value="1" onclick="selectGender(this)">女</div>
        </div>
      </div>
      <div class="field">
        <label>投保年龄（周岁）</label>
        <input id="age" type="number" value="40" min="0" max="72">
      </div>
      <div class="field">
        <label>交费方式</label>
        <select id="term">
          <option value="1">一次交清</option>
          <option value="3" selected>3年交</option>
          <option value="5">5年交</option>
          <option value="10">10年交</option>
        </select>
      </div>
      <div class="field">
        <label>年交保费（元）</label>
        <input id="premium" type="number" value="100000" min="1000" step="1000">
      </div>
      <div class="field">
        <label>显示方式</label>
        <select id="displayMode">
          <option value="all">全部年度</option>
          <option value="after60">60岁后每隔5年</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="btnGenerate" onclick="generate()">📊 生成利益演示</button>
      </div>
    </div>
    <div class="tip">年交保费为1,000元整数倍；一次交清最低10,000元。</div>
  </div>

  <div class="err" id="errorMsg"></div>
  <div id="paramBar"></div>

  <div class="card">
    <div style="display:flex;align-items:center;margin-bottom:10px;">
      <button class="btn btn-dl" onclick="downloadImage()">⬇ 下载演算图片</button>
      <span class="tip" style="margin:0 0 0 12px;">图片含完整演算表，前5年标注"储备期"</span>
    </div>
    <div class="table-scroll">
      <table id="resultTable">
        <thead><tr>
          <th>保单年度</th><th>年龄</th><th>当年保费</th><th>累计保费</th>
          <th>现金价值</th><th>基本保额</th><th>阶段</th>
        </tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<canvas id="renderCanvas"></canvas>
<div class="overlay" id="loadingOverlay"><div>生成中...</div></div>
<div class="toast" id="toast"></div>

<script src="fusheng_calcdata.js"></script>
<script>
let currentGender = 0;

function selectGender(el){
  document.querySelectorAll('.gender-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentGender = parseInt(el.dataset.value);
}

function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
}
function showLoading(s){document.getElementById('loadingOverlay').classList.toggle('show',s);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '-';
  return Math.round(n).toLocaleString('zh-CN');
}

async function generate(){
  const btn=document.getElementById('btnGenerate');
  btn.disabled=true; btn.textContent='计算中...';
  try{
    const age=parseInt(document.getElementById('age').value);
    const term=parseInt(document.getElementById('term').value);
    const premium=parseInt(document.getElementById('premium').value);
    if(isNaN(age)||age<0||age>72){showError('投保年龄须在0~72周岁');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}
    if(isNaN(premium)||premium<(term===1?10000:1000)||premium%1000!==0){showError('保费须为1,000元整数倍（一次交清最低10,000元）');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}
    const maxAgeMap={0:{1:68,3:68,5:67,10:65},1:{1:72,3:72,5:70,10:65}};
    const maxAge=(maxAgeMap[currentGender]&&maxAgeMap[currentGender][term])||65;
    if(age>maxAge){showError(`该交费方式最高投保年龄为${maxAge}周岁`);btn.disabled=false;btn.textContent='📊 生成利益演示';return;}

    const key=`${currentGender}_${age}_${term}`;
    const entry=CALC_DATA_INLINE[key];
    if(!entry){showError('未找到该参数组合的数据，请检查输入');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}

    const scale=premium/1000;
    const sumAssured=Math.round(entry.E*scale);
    const years=entry.y;
    const genderLabel=currentGender===0?'男':'女';
    const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];
    document.getElementById('paramBar').style.display='flex';
    document.getElementById('paramBar').innerHTML=
      `<span>${genderLabel}</span><span>${age}周岁</span><span>${termLabel}</span><span>年交 ${fmt(premium)}元</span><span>基本保额 ${fmt(sumAssured)}元</span>`;

    const dlMode=document.getElementById('displayMode').value;
    const body=document.getElementById('resultBody');
    body.innerHTML='';
    const reserveYears=5;
    let reserveRowCount=0;
    years.forEach(row=>{
      const yr=row[0]; const curAge=age+yr-1;
      const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
      if(!skip && yr<=reserveYears) reserveRowCount++;
    });
    let reserveCellRendered=false;
    years.forEach((row,idx)=>{
      const yr=row[0], prem=row[1], cum=row[2], cash=row[3], sa=row[4];
      const curAge=age+yr-1;
      const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
      if(skip) return;
      const tr=document.createElement('tr');
      const isReserve=yr<=reserveYears;
      let reserveCell='';
      if(isReserve && !reserveCellRendered){
        reserveCell=`<td class="rate-reserve" rowspan="${reserveRowCount}">储备期</td>`;
        reserveCellRendered=true;
      }
      tr.innerHTML=`<td>${yr}</td><td>${curAge}</td><td>${prem>0?fmt(prem*scale):'-'}</td><td>${fmt(cum*scale)}</td>`+
        `<td>${fmt(cash*scale)}</td><td>${fmt(sumAssured)}</td>`+
        reserveCell;
      body.appendChild(tr);
    });
  }catch(e){showError('生成出错：'+e.message);}
  btn.disabled=false; btn.textContent='📊 生成利益演示';
}

function downloadImage(){
  const age=parseInt(document.getElementById('age').value);
  const term=parseInt(document.getElementById('term').value);
  const premium=parseInt(document.getElementById('premium').value);
  const dlMode=document.getElementById('displayMode').value;
  const key=`${currentGender}_${age}_${term}`;
  const entry=CALC_DATA_INLINE[key];
  if(!entry){showToast('请先生成表格');return;}

  const scale=premium/1000;
  const sumAssured=Math.round(entry.E*scale);
  const years=entry.y;
  const reserveYears=5;

  const genderLabel=currentGender===0?'男':'女';
  const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];

  const dlRows=[];
  years.forEach(row=>{
    const yr=row[0],prem=row[1],cum=row[2],cash=row[3],sa=row[4];
    const curAge=age+yr-1;
    const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
    if(skip) return;
    dlRows.push({yr,age:curAge,prem:prem*scale,cum:cum*scale,cash:cash*scale,sa:sumAssured,reserve:yr<=reserveYears});
  });

  const dpr=2;
  const pad=20;
  const colWidths=[70,60,130,140,160,140,90];
  const totalW=colWidths.reduce((a,b)=>a+b,0);
  const headerH=64, rowH=44;
  const titleH=80, infoH=120, paramH=60, subH=14, footerH=40;
  const tableH=headerH+dlRows.length*rowH;
  const canvasW=totalW+pad*2;
  const canvasH=titleH+infoH+paramH+subH+tableH+footerH+pad;
  const canvas=document.getElementById('renderCanvas');
  canvas.width=canvasW*dpr; canvas.height=canvasH*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,canvasW,canvasH);

  // title
  ctx.fillStyle='#1E3A5F'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('福盛世家（添翼版）终身寿险 · 利益演示', canvasW/2, 38);
  ctx.fillStyle='#64748B'; ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('新华保险 · 终身寿险（非分红型）', canvasW/2, 66);

  // info + param
  const infoY=titleH;
  ctx.textAlign='left'; ctx.fillStyle='#334155'; ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(`被保人：${genderLabel} ${age}周岁   |   交费方式：${termLabel}   |   年交保费：${fmt(premium)}元`, pad, infoY+30);
  ctx.fillText(`基本保额：${fmt(sumAssured)}元   |   演示方式：现金价值（保证利益）`, pad, infoY+58);
  ctx.fillText(`生成时间：${new Date().toLocaleDateString('zh-CN')}`, pad, infoY+86);
  const paramY=infoY+infoH;
  ctx.fillStyle='#E2E8F0'; ctx.fillRect(pad,paramY,totalW,paramH);
  ctx.fillStyle='#1E293B'; ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(`${genderLabel} ${age}周岁 · ${termLabel} · 年交${fmt(premium)}元 · 基本保额${fmt(sumAssured)}元`, canvasW/2, paramY+paramH/2);

  const subHdrY=paramY+paramH;
  const tableX=pad, tableY=subHdrY+subH;

  // header
  ctx.fillStyle='#334155'; ctx.fillRect(tableX,tableY,totalW,headerH);
  const headers=['保单\n年度','年龄','当年保费','累计保费','现金价值','基本保额','阶段'];
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  let hx=tableX;
  headers.forEach((h,i)=>{
    ctx.font='bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    const lines=h.split('\n');
    if(lines.length>1){ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';}
    const lh=18; const startY=tableY+headerH/2-(lines.length-1)*lh/2;
    lines.forEach((ln,j)=>ctx.fillText(ln, hx+colWidths[i]/2, startY+j*lh));
    hx+=colWidths[i];
  });

  // rows
  let reserveCellX=0;
  dlRows.forEach((r,idx)=>{
    const y=tableY+headerH+idx*rowH;
    ctx.fillStyle=idx%2===0?'#FFFFFF':'#F0F9FF';
    ctx.fillRect(tableX,y,totalW,rowH);
    ctx.strokeStyle='#E2E8F0'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(tableX,y+rowH); ctx.lineTo(tableX+totalW,y+rowH); ctx.stroke();
    const vals=[
      {t:r.yr,c:'#1E293B',f:'bold 19px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.age,c:'#334155',f:'18px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.prem>0?fmt(r.prem):'-',c:'#334155',f:'17px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.cum),c:'#334155',f:'17px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.cash),c:'#1E293B',f:'bold 19px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.sa),c:'#2563EB',f:'bold 18px "PingFang SC","Microsoft YaHei",sans-serif'}
    ];
    let cx=tableX+6;
    vals.forEach((cv_,i)=>{
      const cellX=cx+colWidths[i]/2;
      ctx.fillStyle=cv_.c; ctx.font=cv_.f; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(cv_.t), cellX, y+rowH/2);
      cx+=colWidths[i];
    });
    if(r.reserve){ reserveCellX=tableX+colWidths.slice(0,6).reduce((a,b)=>a+b,0)+colWidths[6]/2; }
  });

  // 储备期合并单元格（最后列）
  const reserveRows=dlRows.filter(r=>r.reserve);
  if(reserveRows.length>0 && reserveCellX>0){
    const y0=tableY+headerH;
    const blockH=reserveRows.length*rowH;
    const colX=tableX+colWidths.slice(0,6).reduce((a,b)=>a+b,0);
    ctx.fillStyle='#F1F5F9'; ctx.fillRect(colX,y0,colWidths[6],blockH);
    ctx.strokeStyle='#CBD5E1'; ctx.lineWidth=1; ctx.strokeRect(colX+0.5,y0+0.5,colWidths[6]-1,blockH-1);
    ctx.fillStyle='#94A3B8'; ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('储备期', reserveCellX, y0+blockH/2);
  }

  // footer
  ctx.fillStyle='#94A3B8'; ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('本演示基于保证利益（非分红型），仅供产品利益参考，具体以保险合同为准', canvasW/2, tableY+headerH+tableH+24);

  // export
  canvas.toBlob(function(blob){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`福盛世家利益演示_${genderLabel}${age}岁${termLabel}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    showToast('图片已下载');
  },'image/png');
}
</script>
</body>
</html>
