<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恒享人生年金保险 · 利益演示计算器</title>
<style>
  :root{
    --blue:#1E3A5F; --blue2:#2C5282; --gray:#64748B; --graybg:#F1F5F9;
    --headerbg:#334155; --rowalt:#F0F9FF; --line:#E2E8F0; --accent:#2563EB;
    --cv:#2563EB; --surv:#1D4ED8; --ann:#7C3AED;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1E293B;padding:16px;}
  .wrap{max-width:1140px;margin:0 auto;}
  .title-bar{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px;}
  .title-bar h1{font-size:22px;font-weight:700;}
  .title-bar p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5;}
  .card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;color:var(--gray);font-weight:600;}
  .gender-group{display:flex;gap:8px;}
  .gender-btn{padding:9px 20px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--gray);}
  .gender-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;width:140px;}
  .btn{padding:11px 26px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#1D4ED8;}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-dl{background:#059669;margin-left:10px;}
  .btn-dl:hover{background:#047857;}
  #paramBar{display:none;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:14px;}
  #paramBar span{background:var(--graybg);padding:5px 12px;border-radius:20px;font-weight:600;color:var(--blue);}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:980px;}
  thead th{background:var(--headerbg);color:#fff;padding:10px 8px;text-align:center;font-weight:700;font-size:13px;position:sticky;top:0;}
  tbody td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td:first-child,tbody td:nth-child(2){text-align:center;}
  tbody tr:nth-child(even){background:var(--rowalt);}
  .col-cv{color:var(--cv);font-weight:600;}
  .col-surv{color:var(--surv);font-weight:700;}
  .col-ann{color:var(--ann);}
  .rate-reserve{background:#F1F5F9 !important;color:#94A3B8;font-weight:700;text-align:center;vertical-align:middle;}
  .err{display:none;background:#FEE2E2;color:#B91C1C;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600;}
  .err.show{display:block;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;font-size:14px;z-index:99;}
  .toast.show{opacity:1;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:98;}
  .overlay.show{display:flex;}
  .overlay div{background:#fff;padding:22px 34px;border-radius:12px;font-size:16px;font-weight:600;}
  canvas{display:none;}
  .tip{font-size:12px;color:var(--gray);margin-top:8px;}
  .back-link{display:inline-block;margin-bottom:10px;color:#fff;opacity:.9;font-size:13px;text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回资料库</a>
<div class="wrap">
  <div class="title-bar">
    <h1>恒享人生年金保险 · 利益演示计算器</h1>
    <p>新华保险 · 年金保险（非分红型）。输入被保人信息，自动演算各保单年度关爱金/年金、满期、身故、现金价值及生存总利益。前5年为储备期。</p>
  </div>

  <div class="card">
    <div class="form-row">
      <div class="field">
        <label>性别</label>
        <div class="gender-group">
          <div class="gender-btn active" data-value="0" onclick="selectGender(this)">男</div>
          <div class="gender-btn" data-value="1" onclick="selectGender(this)">女</div>
        </div>
      </div>
      <div class="field">
        <label>投保年龄（周岁）</label>
        <input id="age" type="number" value="40" min="0" max="80">
      </div>
      <div class="field">
        <label>交费方式</label>
        <select id="term">
          <option value="1">一次交清</option>
          <option value="3" selected>3年交</option>
          <option value="5">5年交</option>
          <option value="10">10年交</option>
        </select>
      </div>
      <div class="field">
        <label>年交保费（元）</label>
        <input id="premium" type="number" value="100000" min="1000" step="1000">
      </div>
      <div class="field">
        <label>显示方式</label>
        <select id="displayMode">
          <option value="all">全部年度</option>
          <option value="after60">60岁后每隔5年</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="btnGenerate" onclick="generate()">📊 生成利益演示</button>
      </div>
    </div>
    <div class="tip">年交保费为1,000元整数倍；一次交清最低10,000元。保障至105周岁。</div>
  </div>

  <div class="err" id="errorMsg"></div>
  <div id="paramBar"></div>

  <div class="card">
    <div style="display:flex;align-items:center;margin-bottom:10px;">
      <button class="btn btn-dl" onclick="downloadImage()">⬇ 下载演算图片</button>
      <span class="tip" style="margin:0 0 0 12px;">图片含完整演算表，前5年标注"储备期"</span>
    </div>
    <div class="table-scroll">
      <table id="resultTable">
        <thead><tr>
          <th>保单年度</th><th>年龄</th><th>当年保费</th><th>累计保费</th>
          <th>关爱金<br>年金</th><th>累计关爱金<br>年金</th><th>满期生存<br>保险金</th>
          <th>身故<br>保险金</th><th>现金价值</th><th>生存总利益<br>(年末)</th><th>阶段</th>
        </tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<canvas id="renderCanvas"></canvas>
<div class="overlay" id="loadingOverlay"><div>生成中...</div></div>
<div class="toast" id="toast"></div>

<script src="hengxiang_calcdata.js"></script>
<script>
let currentGender = 0;

function selectGender(el){
  document.querySelectorAll('.gender-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  currentGender = parseInt(el.dataset.value);
}

function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
}
function showLoading(s){document.getElementById('loadingOverlay').classList.toggle('show',s);}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '-';
  return Math.round(n).toLocaleString('zh-CN');
}

async function generate(){
  const btn=document.getElementById('btnGenerate');
  btn.disabled=true; btn.textContent='计算中...';
  try{
    const age=parseInt(document.getElementById('age').value);
    const term=parseInt(document.getElementById('term').value);
    const premium=parseInt(document.getElementById('premium').value);
    if(isNaN(age)||age<0||age>80){showError('投保年龄须在0~80周岁');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}
    if(isNaN(premium)||premium<(term===1?10000:1000)||premium%1000!==0){showError('保费须为1,000元整数倍（一次交清最低10,000元）');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}
    const maxAgeMap={0:{1:80,3:77,5:75,10:70},1:{1:80,3:77,5:75,10:70}};
    const maxAge=(maxAgeMap[currentGender]&&maxAgeMap[currentGender][term])||70;
    if(age>maxAge){showError(`该交费方式最高投保年龄为${maxAge}周岁`);btn.disabled=false;btn.textContent='📊 生成利益演示';return;}

    const key=`${currentGender}_${age}_${term}`;
    const entry=CALC_DATA_INLINE[key];
    if(!entry){showError('未找到该参数组合的数据，请检查输入');btn.disabled=false;btn.textContent='📊 生成利益演示';return;}

    const scale=premium/1000;
    const sumAssured=Math.round(entry.E*scale);
    const years=entry.y;
    const genderLabel=currentGender===0?'男':'女';
    const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];
    document.getElementById('paramBar').style.display='flex';
    document.getElementById('paramBar').innerHTML=
      `<span>${genderLabel}</span><span>${age}周岁</span><span>${termLabel}</span><span>年交 ${fmt(premium)}元</span><span>基本保额 ${fmt(sumAssured)}元</span>`;

    const dlMode=document.getElementById('displayMode').value;
    const body=document.getElementById('resultBody');
    body.innerHTML='';
    const reserveYears=5;
    let reserveRowCount=0;
    years.forEach(row=>{
      const yr=row[0]; const curAge=age+yr-1;
      const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
      if(!skip && yr<=reserveYears) reserveRowCount++;
    });
    let reserveCellRendered=false;
    years.forEach((row,idx)=>{
      const yr=row[0], prem=row[1], cum=row[2], ann=row[3], annCum=row[4], mat=row[5], death=row[6], cv=row[7], surv=row[8];
      const curAge=age+yr-1;
      const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
      if(skip) return;
      const tr=document.createElement('tr');
      const isReserve=yr<=reserveYears;
      let reserveCell='';
      if(isReserve && !reserveCellRendered){
        reserveCell=`<td class="rate-reserve" rowspan="${reserveRowCount}">储备期</td>`;
        reserveCellRendered=true;
      }
      tr.innerHTML=`<td>${yr}</td><td>${curAge}</td>`+
        `<td>${prem>0?fmt(prem*scale):'-'}</td><td>${fmt(cum*scale)}</td>`+
        `<td class="col-ann">${ann>0?fmt(ann*scale):'-'}</td><td class="col-ann">${fmt(annCum*scale)}</td>`+
        `<td>${mat>0?fmt(mat*scale):'-'}</td><td>${fmt(death*scale)}</td>`+
        `<td class="col-cv">${fmt(cv*scale)}</td><td class="col-surv">${fmt(surv*scale)}</td>`+
        reserveCell;
      body.appendChild(tr);
    });
  }catch(e){showError('生成出错：'+e.message);}
  btn.disabled=false; btn.textContent='📊 生成利益演示';
}

function downloadImage(){
  const age=parseInt(document.getElementById('age').value);
  const term=parseInt(document.getElementById('term').value);
  const premium=parseInt(document.getElementById('premium').value);
  const dlMode=document.getElementById('displayMode').value;
  const key=`${currentGender}_${age}_${term}`;
  const entry=CALC_DATA_INLINE[key];
  if(!entry){showToast('请先生成表格');return;}

  const scale=premium/1000;
  const sumAssured=Math.round(entry.E*scale);
  const years=entry.y;
  const reserveYears=5;

  const genderLabel=currentGender===0?'男':'女';
  const termLabel={1:'一次交清',3:'3年交',5:'5年交',10:'10年交'}[term];
  const productName='恒享人生保险利益演示';

  // 组装下载行（9列：非分红型，无累计保费/累计关爱金/红利列）
  const dlRows=[];
  years.forEach(row=>{
    const yr=row[0],prem=row[1],ann=row[3],mat=row[5],death=row[6],cv=row[7],surv=row[8];
    const curAge=age+yr-1;
    const skip=(dlMode==='after60'&&curAge>60&&(curAge-60)%5!==0);
    if(skip) return;
    dlRows.push({yr,age:curAge,prem:prem*scale,ann:ann*scale,mat:mat*scale,cv:cv*scale,surv:surv*scale,death:death*scale,reserve:yr<=reserveYears});
  });

  // 统一配色（蓝白）
  const COLORS={
    titleGrad:['#1D4ED8','#2563EB','#1E40AF'],
    companyBg:'#EFF6FF',
    paramBg:'#DBEAFE',
    subHeader:'#1D4ED8',
    tableHeader:'#1E3A5F',
    rowWhite:'#FFFFFF',
    rowAlt:'#F0F9FF',
    reserveBg:'#F1F5F9',
    reserveBorder:'#CBD5E1',
    textDark:'#1E293B',
    textGray:'#334155',
    textLight:'#64748B',
    textMuted:'#94A3B8',
    accentRed:'#DC2626',
    lineColor:'#E2E8F0'
  };
  const PAD=22, DPR=2;
  const TITLE_H=80, INFO_H=130, PARAM_H=52, SUBHDR_H=40, HEADER_H=68, ROW_H=42, FOOTER_H=44;
  // P5 恒享专属 9 列
  const colWidths=[56,48,96,96,100,96,106,100,80];
  const totalW=colWidths.reduce((a,b)=>a+b,0);
  const tableH=HEADER_H+dlRows.length*ROW_H;
  const canvasW=totalW+PAD*2;
  const canvasH=TITLE_H+INFO_H+PARAM_H+SUBHDR_H+tableH+FOOTER_H+PAD*2;
  const canvas=document.getElementById('renderCanvas');
  canvas.width=canvasW*DPR; canvas.height=canvasH*DPR;
  const ctx=canvas.getContext('2d');
  ctx.scale(DPR,DPR);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,canvasW,canvasH);

  // 标题渐变栏
  const tg=ctx.createLinearGradient(0,0,canvasW,0);
  tg.addColorStop(0,COLORS.titleGrad[0]); tg.addColorStop(0.5,COLORS.titleGrad[1]); tg.addColorStop(1,COLORS.titleGrad[2]);
  ctx.fillStyle=tg; ctx.fillRect(0,0,canvasW,TITLE_H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('G23 恒享人生保险利益演示', canvasW/2, 32);
  ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('新华保险 · 年金保险（非分红型）· 保障至105周岁', canvasW/2, 60);

  // 公司介绍区（左右栏）
  const infoY=TITLE_H;
  ctx.fillStyle=COLORS.companyBg; ctx.fillRect(0,infoY,canvasW,INFO_H);
  ctx.strokeStyle=COLORS.lineColor; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(canvasW/2,infoY+12); ctx.lineTo(canvasW/2,infoY+INFO_H-12); ctx.stroke();
  const lx=PAD+4, rx=canvasW/2+12;
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle=COLORS.subHeader; ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('公司背景', lx, infoY+12);
  ctx.fillText('产品特点', rx, infoY+12);
  ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle=COLORS.textGray;
  const leftLines=[
    '· 成立于1996年9月（人民大会堂）',
    '· 中央汇金控股（中农工建4行同属大股东）',
    '· 全国性大型寿险公司',
    '· 2024上市 全球品牌价值2000强'
  ];
  const rightLines=[
    '· 投保年龄：30天-80周岁',
    '· 交费：18-64岁 5万起；领取18-59周岁',
    '· 关爱金：第5年起每年基本保额10%×5年',
    '· 年金：交清后每年固定给付',
    '· 非分红型·保证利益写入合同·保障至105周岁'
  ];
  let ly=infoY+34;
  leftLines.forEach(l=>{ctx.fillText(l,lx,ly);ly+=15;});
  let ry=infoY+34;
  rightLines.forEach(l=>{ctx.fillText(l,rx,ry);ry+=15;});

  // 参数栏
  const paramY=infoY+INFO_H;
  ctx.fillStyle=COLORS.paramBg; ctx.fillRect(0,paramY,canvasW,PARAM_H);
  ctx.fillStyle=COLORS.textDark; ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(`${genderLabel} ${age}周岁 · ${termLabel} · 年交${fmt(premium)}元 · 基本保额${fmt(sumAssured)}元 · 保障终身 · 非分红型(保证利益)`, canvasW/2, paramY+PARAM_H/2);

  // 子标题栏
  const subY=paramY+PARAM_H;
  ctx.fillStyle=COLORS.subHeader; ctx.fillRect(0,subY,canvasW,SUBHDR_H);
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('利 益 演 示 表', canvasW/2, subY+SUBHDR_H/2);

  // 表头
  const tableX=PAD, tableY=subY+SUBHDR_H;
  ctx.fillStyle=COLORS.tableHeader; ctx.fillRect(tableX,tableY,totalW,HEADER_H);
  const headers=['保单\n年度','年龄\n(年末)','当年保险费\n(年初)','关爱金\n年金','满期生存\n保险金','现金价值\n(年末)','生存总利益\n(年末)','身故总利益\n(年末)','储备期'];
  ctx.fillStyle='#FFFFFF'; ctx.textAlign='center'; ctx.textBaseline='middle';
  let hx=tableX;
  headers.forEach((h,i)=>{
    ctx.font='bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    const lines=h.split('\n'); const lh=17; const startY=tableY+HEADER_H/2-(lines.length-1)*lh/2;
    lines.forEach((ln,j)=>ctx.fillText(ln, hx+colWidths[i]/2, startY+j*lh));
    hx+=colWidths[i];
  });

  // 数据行
  const lastColIdx=colWidths.length-1;
  let reserveCellX=0;
  dlRows.forEach((r,idx)=>{
    const y=tableY+HEADER_H+idx*ROW_H;
    ctx.fillStyle=idx%2===0?COLORS.rowWhite:COLORS.rowAlt;
    ctx.fillRect(tableX,y,totalW,ROW_H);
    ctx.strokeStyle=COLORS.lineColor; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(tableX,y+ROW_H); ctx.lineTo(tableX+totalW,y+ROW_H); ctx.stroke();
    // 关爱金：前4年为0正常显示，第5年起出现标红色突出
    const annRed=r.ann>0;
    const vals=[
      {t:r.yr,c:COLORS.textDark,f:'bold 17px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.age,c:COLORS.textGray,f:'16px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.prem>0?fmt(r.prem):'-',c:COLORS.textGray,f:'15px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.ann>0?fmt(r.ann):'-',c:annRed?COLORS.accentRed:COLORS.textGray,f:annRed?'bold 16px "PingFang SC","Microsoft YaHei",sans-serif':'15px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:r.mat>0?fmt(r.mat):'-',c:COLORS.textGray,f:'15px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.cv),c:'#2563EB',f:'bold 16px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.surv),c:'#1D4ED8',f:'bold 17px "PingFang SC","Microsoft YaHei",sans-serif'},
      {t:fmt(r.death),c:COLORS.textGray,f:'15px "PingFang SC","Microsoft YaHei",sans-serif'}
    ];
    let cx=tableX;
    vals.forEach((cv_,i)=>{
      const cellX=cx+colWidths[i]/2;
      ctx.fillStyle=cv_.c; ctx.font=cv_.f; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(cv_.t), cellX, y+ROW_H/2);
      cx+=colWidths[i];
    });
    if(r.reserve){
      const colX=tableX+colWidths.slice(0,lastColIdx).reduce((a,b)=>a+b,0);
      reserveCellX=colX+colWidths[lastColIdx]/2;
    }
  });

  // 储备期合并单元格（两阶段：画完后单独 fillRect+strokeRect+fillText）
  const reserveRows=dlRows.filter(r=>r.reserve);
  if(reserveRows.length>0 && reserveCellX>0){
    const y0=tableY+HEADER_H;
    const blockH=reserveRows.length*ROW_H;
    const colX=tableX+colWidths.slice(0,lastColIdx).reduce((a,b)=>a+b,0);
    ctx.fillStyle=COLORS.reserveBg; ctx.fillRect(colX,y0,colWidths[lastColIdx],blockH);
    ctx.strokeStyle=COLORS.reserveBorder; ctx.lineWidth=1; ctx.strokeRect(colX+0.5,y0+0.5,colWidths[lastColIdx]-1,blockH-1);
    ctx.fillStyle=COLORS.textMuted; ctx.font='bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('储备期', reserveCellX, y0+blockH/2);
  }

  // 页脚声明
  const footerY=tableY+HEADER_H+tableH;
  ctx.fillStyle=COLORS.textMuted; ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('本演示基于保证利益（非分红型），生存总利益=关爱金/年金+满期保险金+现金价值，仅供产品利益参考，具体以保险合同为准', canvasW/2, footerY+FOOTER_H/2);

  // 导出（toDataURL，兼容微信X5）
  const dataUrl=canvas.toDataURL('image/png');
  const a=document.createElement('a');
  a.href=dataUrl; a.download=`${productName}_${genderLabel}${age}岁${termLabel}_保费${fmt(premium)}元.png`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('计划书已下载');
}
</script>
</body>
