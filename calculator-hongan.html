<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏安世家 终身寿险（分红型）· 利益演示计算器</title>
<style>
:root{ --blue:#1E3A5F; --blue2:#2C5282; --gray:#64748B; --graybg:#F1F5F9; --headerbg:#1E3A8A; --rowalt:#F0F9FF; --line:#E2E8F0; --accent:#1D4ED8; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F7;color:#1E293B;padding:16px;}
.wrap{max-width:1080px;margin:0 auto;}
.title-bar{background:linear-gradient(135deg,#1E3A5F,#2C5282);color:#fff;border-radius:12px;padding:18px 22px;margin-bottom:14px;}
.title-bar h1{font-size:22px;font-weight:700;}
.title-bar p{font-size:13px;opacity:.85;margin-top:6px;line-height:1.5;}
.card{background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;color:var(--gray);font-weight:600;}
.gender-group{display:flex;gap:8px;}
.gender-btn{padding:9px 20px;border:1.5px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;color:var(--gray);}
.gender-btn.active{background:#1E3A5F;color:#fff;border-color:#1E3A5F;}
input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;width:140px;}
.btn{padding:11px 26px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;}
.btn:hover{background:#1D4ED8;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-dl{background:#059669;margin-left:10px;}
.btn-dl:hover{background:#047857;}
#paramBar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:14px;}
#paramBar span{background:var(--graybg);padding:5px 12px;border-radius:20px;font-weight:600;color:#1E3A8A;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px;}
thead th{background:#1E3A8A;color:#fff;padding:11px 8px;text-align:center;font-weight:700;font-size:14px;position:sticky;top:0;}
tbody td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr.row-5y{background:#DBEAFE;} tbody tr.row-last{background:#BFDBFE;}
.col-cv{font-weight:800;color:#1E3A8A;} .col-total{color:#1E3A8A;font-weight:700;} .col-num{font-weight:600;color:#1E293B;}
.err{display:none;background:#FEE2E2;color:#B91C1C;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px;font-weight:600;}
.err.show{display:block;}
.tip{font-size:12px;color:var(--gray);margin-top:8px;}
.dl-bar{display:flex;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.dl-bar .tip{margin:0 0 0 12px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:98;}
.overlay.show{display:flex;}
.overlay div{background:#fff;padding:22px 34px;border-radius:12px;font-size:16px;font-weight:600;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:24px;opacity:0;transition:.3s;font-size:14px;z-index:99;}
.toast.show{opacity:1;}
#renderCanvas{display:none;}
@media(max-width:768px){ .btn{padding:13px 18px;font-size:15px;min-height:46px;} .dl-bar{flex-direction:column;align-items:stretch!important;} .btn-dl{margin-left:0!important;width:100%;} .dl-bar .tip{margin:8px 0 0 0!important;} .form-row{flex-direction:column;align-items:stretch;} .field{width:100%;} input,select{width:100%;} .gender-btn{flex:1;text-align:center;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="title-bar">
    <h1>宏安世家 终身寿险（分红型）· 利益演示计算器</h1>
    <p>新华保险 · 分红型终身寿险。含特定公共交通意外及全残保障。红利按累积生息方式演示。</p>
  </div>

  <div class="card">
    <div class="form-row">
      <div class="field">
        <label>性别</label>
        <div class="gender-group">
          <div class="gender-btn" data-value="0" onclick="selectGender(this)">男</div>
          <div class="gender-btn active" data-value="1" onclick="selectGender(this)">女</div>
        </div>
      </div>
      <div class="field">
        <label>投保年龄（周岁）</label>
        <input id="age" type="number" value="40" min="0" max="69">
      </div>
      <div class="field">
        <label>交费方式</label>
        <select id="term">
          <option value="1">一次交清</option>
          <option value="3" selected>3年交</option>
          <option value="5">5年交</option>
        </select>
      </div>
      <div class="field">
        <label>年交保费（元）</label>
        <input id="premium" type="number" value="1000000" min="1000" step="1000">
      </div>
      <div class="field">
        <label>红利领取方式</label>
        <select id="dividendMode" onchange="onDividendModeChange()">
          <option value="cumulative" selected>累计生息</option>
          <option value="paidup">交清增额</option>
        </select>
      </div>
      <div class="field" id="rateField">
        <label>累计生息利率（%）</label>
        <input id="cumRate" type="number" value="2.5" min="0" max="10" step="0.1">
      </div>
      <div class="field">
        <label>显示密度</label>
        <select id="displayMode" onchange="filterRowsByAge(this.value)">
          <option value="all">显示全部</option>
          <option value="2y">60岁起每2年一行</option>
          <option value="5y" selected>60岁起每5年一行</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="btnGenerate" onclick="generate()">生成利益演示</button>
      </div>
    </div>
    <div class="tip">默认演示：女40周岁 / 3年交 / 年交100万元。红利按累计生息方式演示，利率2.5%。切换交清增额后利率锁定1.75%。</div>
  </div>

  <div class="err" id="errorMsg"></div>
  <div id="paramBar"></div>

  <div class="card">
    <div class="dl-bar">
      <button class="btn btn-dl" onclick="downloadImage()">下载理财计划书图片</button>
      <span class="tip">导出效果图同款版式</span>
    </div>
    <div class="table-scroll">
      <table id="resultTable">
        <thead>
          <tr>
            <th>保单<br>年度</th>
            <th>年龄<br>（年末）</th>
            <th>当期保费</th>
            <th>累计保费</th>
            <th>现金价值</th>
            <th id="divColHeader">现金红利<br>累计生息</th>
            <th>身价总利益</th>
            <th>航空意外<br>额外保额</th>
            <th>生存总利益</th>
            <th>当年<br>收益率</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div style="text-align:center;padding:16px;font-size:12px;color:#64748B;line-height:1.8;">
  本页面及演示说明仅供内部保险从业人员学习、交流使用，数据仅供参考，<br>
  数据中含分红部分是不确定的，详细内容具体应以保单条款及保险合同为准。
</div>

<canvas id="renderCanvas"></canvas>
<div class="overlay" id="loadingOverlay"><div>生成中...</div></div>
<div class="toast" id="toast"></div>

<script>
let CALC_DATA = null;
let currentGender = 1;

function selectGender(el) {
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentGender = parseInt(el.dataset.value);
}

function onDividendModeChange() {
  const mode = document.getElementById('dividendMode').value;
  const rateField = document.getElementById('rateField');
  const rateInput = document.getElementById('cumRate');
  const colHeader = document.getElementById('divColHeader');
  
  if (mode === 'paidup') {
    rateField.style.display = 'none';
    rateInput.value = '1.75';
    colHeader.innerHTML = '交清增额<br>累计利益';
  } else {
    rateField.style.display = 'flex';
    rateInput.value = '2.5';
    colHeader.innerHTML = '现金红利<br>累计生息';
  }
}

async function loadData() {
  if (CALC_DATA) return;
  try {
    const res = await fetch('data_hongan.json');
    CALC_DATA = await res.json();
  } catch(e) {
    showError('数据加载失败，请检查网络');
  }
}

function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 5000); }
function showLoading(show) { document.getElementById('loadingOverlay').classList.toggle('show', show); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function fmt(n) { if (n === null || n === undefined) return '-'; return Math.round(n).toLocaleString('zh-CN'); }

function getLeverage(age) {
  if (age <= 40) return 1.6;
  if (age <= 60) return 1.4;
  return 1.2;
}

async function generate() {
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true; btn.textContent = '计算中...';
  try {
    await loadData();
    const age = parseInt(document.getElementById('age').value);
    const term = parseInt(document.getElementById('term').value);
    const premium = parseInt(document.getElementById('premium').value);

    if (isNaN(age) || age < 0 || age > 69) { showError('投保年龄须在0~69周岁之间'); btn.disabled = false; btn.textContent = '生成利益演示'; return; }
    if (isNaN(premium) || premium < 1000 || premium % 1000 !== 0) { showError('年交保费最低1,000元，且应为1,000元整数倍'); btn.disabled = false; btn.textContent = '生成利益演示'; return; }

    const maxAgeMap = { 0: { 1: 65, 3: 64, 5: 64 }, 1: { 1: 69, 3: 68, 5: 68 } };
    const maxAge = (maxAgeMap[currentGender] && maxAgeMap[currentGender][term]) || 65;
    if (age > maxAge) { showError(`该交费方式最高投保年龄为${maxAge}周岁`); btn.disabled = false; btn.textContent = '生成利益演示'; return; }

    const scale = premium / 100000000;
    const payYears = term === 1 ? 1 : term;
    const reserveYears = payYears + 2;

    const genderLabel = currentGender === 0 ? '男士' : '女士';
    const termLabel = {1:'趸交',3:'缴3年',5:'缴5年'}[term];
    const pb = document.getElementById('paramBar'); pb.style.display = 'flex';
    const divMode = document.getElementById('dividendMode').value;
    const cumRate = parseFloat(document.getElementById('cumRate').value) || 2.5;
    const divLabel = divMode === 'paidup' ? `交清增额(1.75%)` : `累计生息(${cumRate}%)`;
    pb.innerHTML = `<strong style="color:#1E3A8A;font-size:18px;">${age}岁${genderLabel}</strong> · <strong style="color:#1E3A8A;font-size:18px;">每年${fmt(premium)}</strong> · <strong style="color:#1E3A8A;font-size:18px;">${termLabel}</strong> · <span style="color:#64748B;">${divLabel}</span>`;

    const tbody = document.getElementById('resultBody');
    let html = '';
    let cumDiv = 0;
    let cumPrem = 0;
    const cumRateVal = parseFloat(document.getElementById('cumRate').value) || 2.5;
    const effectiveRate = 1 + cumRateVal / 100;

    for (let yr = 1; yr <= 106; yr++) {
      const key = `${currentGender}_${age}_${term}_${yr}`;
      const d = CALC_DATA[key];
      if (!d) break;

      const currentAge = age + yr - 1;
      const cv = d.cv * scale;
      const cashDiv = d.cash_div * scale;
      const sumAssured = d.sum_assured * scale;
      const aviation = d.aviation * scale;

      cumDiv = cumDiv * effectiveRate + cashDiv;
      const annualPrem = yr <= payYears ? premium : 0;
      cumPrem += annualPrem;

      const leverage = getLeverage(currentAge);
      const deathValue = Math.max(cv, cumPrem * leverage);
      const totalBenefit = deathValue + cumDiv;
      const survival = cv + cumDiv;

      // 当年收益率（年化单利）= (生存总利益 - 累计保费) / 累计保费 / 保单年度 × 100%
      // 前 payYears+2 年为"储备期"，合并居中显示
      const isReserveYear = yr <= reserveYears;
      let yieldCell;
      if (isReserveYear) {
        if (yr === 1) {
          yieldCell = `<td class="rate-reserve" rowspan="${reserveYears}" style="background:#F5F5F5 !important;color:#888;font-weight:800;text-align:center;vertical-align:middle;">储备期</td>`;
        } else {
          yieldCell = '';
        }
      } else {
        if (cumPrem > 0 && yr > 0) {
          yieldRate = ((survival - cumPrem) / cumPrem / yr * 100).toFixed(2) + '%';
        }
        yieldCell = `<td style="color:#B91C1C;font-weight:700;">${yieldRate}</td>`;
      }

      const is5y = yr >= 5 && yr % 5 === 0;
      const rowClass = is5y ? 'row-5y' : '';

      html += `<tr class="${rowClass}">
        <td class="col-num">${yr}</td>
        <td>${currentAge}</td>
        <td>${annualPrem > 0 ? fmt(annualPrem) : '-'}</td>
        <td>${fmt(cumPrem)}</td>
        <td class="col-cv">${fmt(cv)}</td>
        <td>${fmt(cumDiv)}</td>
        <td class="col-total">${fmt(totalBenefit)}</td>
        <td>${fmt(aviation)}</td>
        <td class="col-total">${fmt(survival)}</td>
        ${yieldCell}
      </tr>`;
    }

    tbody.innerHTML = html;
    document.getElementById('errorMsg').classList.remove('show');
    filterRowsByAge('5y');
  } catch (e) { showError('计算出错：' + e.message); }
  finally { btn.disabled = false; btn.textContent = '生成利益演示'; }
}

function filterRowsByAge(mode) {
  const rows = document.querySelectorAll('#resultBody tr');
  rows.forEach(row => {
    const ageCell = row.cells[1];
    if (!ageCell) return;
    const age = parseInt(ageCell.textContent);
    const yr = parseInt(row.cells[0].textContent);
    if (mode === 'all') { row.style.display = ''; }
    else if (mode === '2y') { row.style.display = (age <= 60 || (age - 60) % 2 === 0) ? '' : 'none'; }
    else if (mode === '5y') { row.style.display = (age <= 60 || (age - 60) % 5 === 0) ? '' : 'none'; }
  });
}

function downloadImage() {
  const tbody = document.getElementById('resultBody');
  if (!tbody || !tbody.innerHTML) { showToast('请先生成利益演示'); return; }
  showLoading(true);

  setTimeout(() => {
    try {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      const age = parseInt(document.getElementById('age').value);
      const term = parseInt(document.getElementById('term').value);
      const premium = parseInt(document.getElementById('premium').value);
      const genderLabel = currentGender === 0 ? '男' : '女';
      const termLabel = {1:'一次交清',3:'3年交',5:'5年交'}[term];
      const scale = premium / 100000000;
      const payYears = term === 1 ? 1 : term;
      const cumRateVal = parseFloat(document.getElementById('cumRate').value) || 2.5;
      const effectiveRate = 1 + cumRateVal / 100;
      const divMode = document.getElementById('dividendMode').value;
      const divColLabel = divMode === 'paidup' ? '交清增额累计利益' : `现金红利累计生息(${cumRateVal}%)`;

      // 过滤可见行
      filterRowsByAge('5y');
      const rows = Array.from(tbody.querySelectorAll('tr')).filter(r => r.style.display !== 'none');

      const colWidths = [80, 70, 100, 110, 120, 120, 130, 120, 130, 100];
      const totalWidth = colWidths.reduce((a,b)=>a+b,0);
      const rowH = 42;
      const headerH = 70;
      const titleH = 80;
      const paramH = 50;
      const padding = 20;
      const tableH = headerH + rows.length * rowH;
      const tableY = titleH + paramH + 30;
      const footerY = tableY + tableH + 10;
      const canvasW = totalWidth + padding * 2;
      const canvasH = footerY + 36;

      canvas.width = canvasW * 2;
      canvas.height = canvasH * 2;
      canvas.style.width = canvasW + 'px';
      canvas.style.height = canvasH + 'px';
      ctx.scale(2, 2);

      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvasW, canvasH);

      // Title
      const grad = ctx.createLinearGradient(0, 0, canvasW, 0);
      grad.addColorStop(0, '#1D4ED8'); grad.addColorStop(0.5, '#2563EB'); grad.addColorStop(1, '#1E40AF');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvasW, titleH);
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 30px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('新华宏安世家终身寿险（分红型）保险计划书', canvasW / 2, 52);

      // Param bar
      const paramY = titleH + 10;
      const totalPrem = premium * payYears;
      const divDesc = divMode === 'paidup' ? '交清增额(1.75%)' : `累计生息(${cumRateVal}%)`;
      ctx.fillStyle = '#DBEAFE'; ctx.fillRect(padding, paramY, canvasW - padding * 2, paramH);
      ctx.fillStyle = '#1E293B'; ctx.font = 'bold 16px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`性别 ${genderLabel}  年龄 ${age}周岁  年缴保费 ${premium.toLocaleString()}元  缴费期限 ${termLabel}  总保费 ${totalPrem.toLocaleString()}元  ${divDesc}  保险期间 终身`, canvasW / 2, paramY + 32);

      // Table header
      const tableX = padding;
      ctx.fillStyle = '#1D4ED8'; ctx.fillRect(tableX, tableY, totalWidth, headerH);
      const headers = ['保单年度', '年龄', '当期保费', '累计保费', '现金价值', divColLabel, '身价总利益', '航空意外\n额外保额', '生存总利益', '当年\n收益率'];
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 17px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
      let x = tableX + 6;
      headers.forEach((h, i) => {
        const lines = h.split('\n');
        const cx = x + colWidths[i] / 2;
        if (lines.length === 1) ctx.fillText(lines[0], cx, tableY + headerH / 2 + 5);
        else { ctx.fillText(lines[0], cx, tableY + headerH / 2 - 5); ctx.fillText(lines[1], cx, tableY + headerH / 2 + 15); }
        x += colWidths[i];
      });

      // Table data
      let cumDiv = 0, cumPrem = 0;
      let dlReserveStartIdx = -1, dlReserveCount = 0, reserveCenterX = 0;
      const reserveColIdx = 9; // 当年收益率是第10列(索引9)
      rows.forEach((row, idx) => {
        const y = tableY + headerH + idx * rowH;
        ctx.fillStyle = idx % 2 === 0 ? '#FFFFFF' : '#F0F9FF'; ctx.fillRect(tableX, y, totalWidth, rowH);
        ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(tableX, y + rowH); ctx.lineTo(tableX + totalWidth, y + rowH); ctx.stroke();

        const yr = parseInt(row.cells[0].textContent);
        const currentAge = parseInt(row.cells[1].textContent);
        const key = `${currentGender}_${age}_${term}_${yr}`;
        const d = CALC_DATA[key];
        if (!d) return;

        const cv = d.cv * scale;
        const cashDiv = d.cash_div * scale;
        const aviation = d.aviation * scale;
        cumDiv = cumDiv * effectiveRate + cashDiv;
        const annualPrem = yr <= payYears ? premium : 0;
        cumPrem += annualPrem;
        const leverage = getLeverage(currentAge);
        const deathValue = Math.max(cv, cumPrem * leverage);
        const totalBenefit = deathValue + cumDiv;
        const survival = cv + cumDiv;

        // 当年收益率（储备期合并显示）
        let yieldRate = '-';
        const isReserveRow = yr <= dlPayYears + 2;
        if (!isReserveRow && cumPrem > 0 && yr > 0) {
          yieldRate = ((survival - cumPrem) / cumPrem / yr * 100).toFixed(2) + '%';
        }

        const vals = [
          { t: yr, c: '#1E293B', f: 'bold 16px "PingFang SC"' },
          { t: currentAge, c: '#334155', f: '16px "PingFang SC"' },
          { t: annualPrem > 0 ? fmt(annualPrem) : '-', c: '#334155', f: '16px "PingFang SC"' },
          { t: fmt(cumPrem), c: '#334155', f: '16px "PingFang SC"' },
          { t: fmt(cv), c: '#2563EB', f: '16px "PingFang SC"' },
          { t: fmt(cumDiv), c: '#1E40AF', f: '16px "PingFang SC"' },
          { t: fmt(totalBenefit), c: '#1D4ED8', f: 'bold 17px "PingFang SC"' },
          { t: fmt(aviation), c: '#334155', f: '16px "PingFang SC"' },
          { t: fmt(survival), c: '#1E3A5F', f: 'bold 17px "PingFang SC"' },
          { t: isReserveRow ? '' : yieldRate, c: isReserveRow ? '#94A3B8' : '#B91C1C', f: `bold ${isReserveRow ? '17' : '16'}px "PingFang SC"` }
        ];
        let cx = tableX + 6;
        vals.forEach((v, ci) => {
          if (isReserveRow && ci === 9) {
            // 储备期列记录位置，稍后统一绘制
            if (dlReserveStartIdx === -1) dlReserveStartIdx = idx;
            dlReserveCount++;
            reserveCenterX = cx + colWidths[ci] / 2;
          } else {
            ctx.fillStyle = v.c; ctx.font = v.f; ctx.textAlign = 'center'; ctx.fillText(String(v.t), cx + colWidths[ci] / 2, y + rowH / 2 + 5);
          }
          cx += colWidths[ci];
        });
      });

      // 储备期合并单元格
      if (dlReserveStartIdx >= 0 && dlReserveCount > 0) {
        const rsvX = tableX + colWidths.slice(0, reserveColIdx).reduce((a,b)=>a+b,0);
        const rsvY = tableY + headerH + dlReserveStartIdx * rowH;
        const rsvH = dlReserveCount * rowH;
        const rsvW = colWidths[reserveColIdx];
        ctx.fillStyle = '#F5F5F5';
        ctx.fillRect(rsvX, rsvY, rsvW, rsvH);
        ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1;
        ctx.strokeRect(rsvX + 0.5, rsvY + 0.5, rsvW - 1, rsvH - 1);
        ctx.fillStyle = '#94A3B8'; ctx.font = 'bold 17px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('储备期', reserveCenterX, rsvY + rsvH / 2);
      }

      // Footer
      ctx.fillStyle = '#94A3B8'; ctx.font = '13px "PingFang SC", "Microsoft YaHei", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('本计划书数据源自官方演算表，仅供参考。具体利益以保险合同条款和正式计划书为准。', canvasW / 2, footerY + 10);
      ctx.fillText('红利演示为基于公司经营假设的预期值，实际红利可能高于或低于演示值。', canvasW / 2, footerY + 28);

      const filename = `宏安世家_${genderLabel}${age}岁_${termLabel}_保费${premium}元.png`;
      downloadViaCanvas(canvas, filename);
      showLoading(false);
    } catch (e) { showError('图片生成失败：' + e.message); showLoading(false); }
  }, 200);
}

function downloadViaCanvas(canvas, filename) {
  if (canvas.toBlob) {
    canvas.toBlob(blob => {
      if (blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
        showToast('计划书图片已下载');
      } else { downloadViaDataURL(canvas, filename); }
    }, 'image/png');
  } else { downloadViaDataURL(canvas, filename); }
}

function downloadViaDataURL(canvas, filename) {
  const dataURL = canvas.toDataURL('image/png');
  const a = document.createElement('a'); a.href = dataURL; a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => document.body.removeChild(a), 100);
  showToast('计划书图片已下载');
}

document.getElementById('premium').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
document.getElementById('age').addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
setTimeout(() => { try { generate(); } catch(e) {} }, 100);
</script>
