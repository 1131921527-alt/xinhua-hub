<body><main class="knowledge kt-shell"><a href="about-xinhua.html">← 返回认识新华</a><h1>内容拼装器</h1><p class="kt-note">使用与主题页相同的已核验内容；可增删、拖动排序或用上下按钮调整。当前提供公司与分红6个模块，产品规则模块待核验后接入。</p><div class="kt-composer"><aside class="kt-controls"><h2>选择内容</h2><div id="module-choices"></div><label>展示版本<select id="composer-style"><option value="client">客户版</option><option value="professional">专业版</option><option value="compact">简洁版</option></select></label><label style="margin-top:12px">图片模式<select id="composer-mode"><option value="long">长图：按当前顺序组合</option><option value="single">单页：每个模块一张</option></select></label><div class="kt-toolbar"><button class="kt-button primary" id="download-composition">下载图片</button></div><p class="kt-note">移动端同样可导出完整图片；多张下载可能需要允许浏览器的多文件下载权限。单页模式不缩小文字硬塞纸张。</p><p id="composer-status" role="status"></p></aside><div id="composer-preview" class="kt-style-client" aria-live="polite"><p>正在加载已核验模块…</p></div></div></main></body></html>
