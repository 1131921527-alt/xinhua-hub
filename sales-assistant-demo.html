<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新华Hub · 销售助手（原型）</title>
<style>
  :root{
    --brand:#dc2626;
    --brand-dark:#b91c1c;
    --bg:#f0f2f5;
    --card:#ffffff;
    --text:#1f2329;
    --text-light:#8a9099;
    --line:#ebedf0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:48px}
  /* 顶部栏：像微信工具，不像后台 */
  .topbar{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .topbar .logo{font-size:18px;font-weight:700;letter-spacing:.5px}
  .topbar .sub{font-size:12px;opacity:.9;margin-left:auto;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px}
  /* 搜索区 */
  .search{padding:16px}
  .search .hint{font-size:13px;color:var(--text-light);margin-bottom:8px}
  .search input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:15px 14px;font-size:16px;background:#fff;outline:none;transition:.2s}
  .search input:focus{border-color:var(--brand)}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;color:#fff;background:var(--brand);margin-top:12px;cursor:pointer;transition:.15s}
  .btn:active{background:var(--brand-dark);transform:scale(.99)}
  /* 结果卡：白色圆角卡片 + 区块间距 */
  .card{background:var(--card);border-radius:16px;padding:16px;margin:0 14px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card .label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:10px}
  .card .label .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
  .pname{font-size:19px;font-weight:700;margin:0 0 2px}
  .remark{font-size:12.5px;color:var(--text-light);margin-bottom:10px}
  .intro{font-size:15px;color:#333}
  /* 工具按钮行 */
  .row{display:flex;gap:10px}
  .tool-btn{flex:1;border:1.5px solid var(--brand);color:var(--brand);background:#fff;border-radius:12px;padding:13px 8px;font-size:14px;font-weight:600;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
  .tool-btn.primary{background:var(--brand);color:#fff}
  .tool-btn:active{opacity:.85}
  /* 三版话术 */
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:13px;background:#f2f3f5;color:var(--text-light);cursor:pointer;transition:.15s}
  .tab.active{background:var(--brand);color:#fff;font-weight:600}
  .script-box{background:#f7f8fa;border-radius:12px;padding:13px;font-size:14px;color:#2b2f36;white-space:pre-wrap;min-height:64px}
  .copy-btn{margin-top:10px;border:none;background:#fff;border:1.5px solid var(--brand);color:var(--brand);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .copy-btn:active{background:#fff0f0}
  /* FAQ 折叠 */
  .faq-item{border-bottom:1px solid var(--line);padding:12px 0}
  .faq-item:last-child{border-bottom:none;padding-bottom:0}
  .faq-q{font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .faq-q .arrow{color:var(--text-light);font-size:13px;transition:.2s}
  .faq-item.open .faq-q .arrow{transform:rotate(90deg)}
  .faq-a{font-size:13.5px;color:#4a4f57;margin-top:8px;display:none;line-height:1.7}
  .faq-item.open .faq-a{display:block}
  /* 未找到 */
  .empty{text-align:center;padding:30px 16px;color:var(--text-light)}
  .empty .big{font-size:15px;color:#555;margin-bottom:8px}
  .empty .plist{display:inline-block;background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;color:var(--brand);margin-top:6px}
  /* 提示条 + 页脚声明 */
  .toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:80%;text-align:center}
  .toast.show{opacity:1}
  .note{font-size:12px;color:var(--text-light);text-align:center;padding:8px 24px 0;line-height:1.6}
  .hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="logo">🛟 新华Hub</span>
    <span class="sub">销售助手 · 原型</span>
  </div>

  <div class="search">
    <div class="hint">说一句话，10 秒出销售素材 · 不限制格式</div>
    <input id="q" value="宏安世家，客户30岁女，20万交3年" placeholder="例如：宏安世家，客户30岁女，20万交3年" />
    <button class="btn" onclick="run()">查 询</button>
  </div>

  <div id="result"></div>

  <div class="note">本页为原型演示 · 话术与 FAQ 为示例稿，实际以公司正式资料与条款为准</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 产品工具包数据：第一版只放宏安世家，后续加产品只需往里补 */
const PRODUCTS = [
  {
    key:'hongAn',
    keyword:'宏安',
    name:'宏安世家',
    remark:'客户备注：30岁 女 · 20万交3年（演示）',
    intro:'宏安世家是增额终身寿险，现金价值长期稳定增长，适合想做稳健资产底仓、有孩子教育或养老规划的中产家庭。',
    calc:'calculator-hongan.html',
    scripts:{
      short:'宏安世家，锁定长期稳定增值的终身寿，20万交3年，适合做孩子教育或自己养老的底仓。方案图我发您看看~',
      std:'姐，这款是增额终身寿，说白了就是让钱按约定长期稳稳长大。您 30 岁、一年 20 万交 3 年，后面现金价值逐年递增，需要用钱时可以减保取一部分，不取就一直滚。比单纯存定期多一层确定性，也方便以后给孩子或自己留一笔。',
      deep:'存款胜在灵活、短期稳，但利率是往下走的，长期看复利效应弱。这款前期现金价值增长慢一点，但锁定的是长期复利，持有越久优势越明显，而且有身故保障和传承功能，存款没有。如果您这笔钱是 10 年以上的规划，它比存款更划算；如果是两三年内要用的活钱，那还是存款更合适。咱按您的真实用途来选，不硬推。'
    },
    faq:[
      ['分红可靠吗？','宏安世家是增额终身寿，利益以合同约定的现金价值写进保单，白纸黑字确定；分红型部分看公司实际经营，不是固定承诺。简单说：保证的部分合同里看得见，浮动的分红不保证。'],
      ['为什么选这个产品？','锁定长期复利、现金价值写进合同、兼顾身故保障和传承，适合做 10 年以上的稳健底仓，比单纯存定期多一层确定性。'],
      ['现金价值怎么看？','保单里有一张现金价值表，对应每个年度的账户价值，就是您那年“退保能拿回的钱”。需要用钱时可减保取一部分，不取就按约定长期增长。'],
      ['中途急用钱怎么办？','两种常见方式：一是减保，取一部分现金价值出来用；二是保单贷款，一般可贷出现金价值的 80% 左右，不影响保障。具体以条款和当时规则为准。'],
      ['和银行理财 / 存款有啥区别？','存款/理财胜在灵活短期稳，但利率下行、长期复利弱；这款前期现价增长慢，但锁定长期复利，越久越明显，还带身故保障和传承功能。活钱放存款，长钱做规划，各司其职。']
    ]
  }
];

let currentScript = '';

function run(){
  const text = (document.getElementById('q').value || '').trim();
  const p = PRODUCTS.find(p => text.includes(p.keyword));
  if(!p){ renderEmpty(); return; }
  render(p);
}

function render(p){
  currentScript = p.scripts.short;
  const faqHtml = p.faq.map((f,i)=>`
    <div class="faq-item" onclick="toggleFaq(this)">
      <div class="faq-q">${f[0]}<span class="arrow">▶</span></div>
      <div class="faq-a">${f[1]}</div>
    </div>`).join('');

  document.getElementById('result').innerHTML = `
    <!-- 1. 一句话介绍 -->
    <div class="card">
      <div class="label"><span class="num">1</span> 产品一句话介绍</div>
      <div class="pname">${p.name}</div>
      <div class="remark">${p.remark}</div>
      <div class="intro">${p.intro}</div>
    </div>

    <!-- 2. 在线测算 -->
    <div class="card">
      <div class="label"><span class="num">2</span> 在线测算</div>
      <div class="row">
        <a class="tool-btn primary" href="${p.calc}">🧮 打开演算器</a>
      </div>
    </div>

    <!-- 3. 生成客户方案图（占位） -->
    <div class="card">
      <div class="label"><span class="num">3</span> 生成客户方案图</div>
      <div class="row">
        <button class="tool-btn" onclick="toast('方案图生成功能开发中，敬请期待')">🖼️ 生成方案图</button>
      </div>
    </div>

    <!-- 4. 三版话术 -->
    <div class="card">
      <div class="label"><span class="num">4</span> 三版客户话术</div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab(this,'short')">微信简短</div>
        <div class="tab" onclick="switchTab(this,'std')">面谈标准</div>
        <div class="tab" onclick="switchTab(this,'deep')">深度解释</div>
      </div>
      <div class="script-box" id="scriptBox">${p.scripts.short}</div>
      <button class="copy-btn" onclick="copyScript()">📋 复制话术</button>
    </div>

    <!-- 5. FAQ -->
    <div class="card">
      <div class="label"><span class="num">5</span> 常见问题 FAQ</div>
      ${faqHtml}
    </div>
  `;
}

function renderEmpty(){
  document.getElementById('result').innerHTML = `
    <div class="card empty">
      <div class="big">没匹配到产品，您是想看哪个？</div>
      <div>目前原型只收录了：</div>
      <div class="plist">宏安世家</div>
    </div>`;
}

function switchTab(el, type){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const p = PRODUCTS.find(p=> (document.getElementById('q').value||'').includes(p.keyword)) || PRODUCTS[0];
  currentScript = p.scripts[type];
  document.getElementById('scriptBox').textContent = currentScript;
}

function toggleFaq(el){ el.classList.toggle('open'); }

function copyScript(){
  const text = currentScript;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('话术已复制 ✓')).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('话术已复制 ✓'); }
  catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* 进入页面即展示一次结果，方便直接看效果 */
run();
</script>
</body>
</html>
