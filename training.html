<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="新华Hub 知识资料库 — 产品说明 / 分红解读 / 公司实力 / 知识卡，数据驱动，持续更新。">
<title>知识资料库 · 新华Hub</title>
<link rel="stylesheet" href="assets/css/theme.css">
<style>
  .train-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
    color: #fff; padding: 40px 20px 22px; position: relative; overflow: hidden;
  }
  .train-header::after {
    content: ""; position: absolute; bottom: -30%; right: -10%;
    width: 160px; height: 160px; background: rgba(255,255,255,.05); border-radius: 50%;
  }
  .train-header h1 { font-size: 22px; font-weight: 700; }
  .train-header p { font-size: 13px; opacity: .82; margin-top: 4px; }

  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px var(--page-x) 4px; }
  .filter-chip {
    padding: 7px 14px; border-radius: var(--radius-lg); background: #fff;
    border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-2);
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .course-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    padding: 12px var(--page-x) 24px;
  }
  .course-card {
    background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; flex-direction: column;
    transition: transform .2s, box-shadow .2s;
  }
  .course-card:active { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  .course-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg-alt); }
  .course-body { padding: 12px 14px 14px; display: flex; flex-direction: column; flex: 1; }
  .course-cat { font-size: 11px; color: var(--primary-dark); font-weight: 700; }
  .course-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 4px 0 6px; line-height: 1.3; }
  .course-meta { font-size: 12px; color: var(--text-3); display: flex; gap: 10px; flex-wrap: wrap; }
  .course-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .course-actions { display: flex; gap: 8px; margin-top: auto; }
  .course-actions a { flex: 1; }
  .empty { text-align: center; color: var(--text-4); padding: 40px; font-size: 14px; }

  /* 相关产品与资源（T095 交叉引用） */
  .rel-wrap { padding: 8px var(--page-x) 92px; }
  .rel-title { font-size: 16px; font-weight: 800; color: var(--text); margin: 6px 0 12px; }
  .rel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rel-card {
    display: flex; align-items: center; gap: 8px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px;
    font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; box-shadow: var(--shadow);
  }
  .rel-card:active { background: var(--bg-alt); }

  @media (max-width: 360px) { .course-grid { grid-template-columns: 1fr; } .rel-grid { grid-template-columns: 1fr; } }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: var(--maxw); margin: 0 auto;
    display: flex; background: #fff; border-top: 1px solid var(--border); z-index: var(--z-header);
    padding-bottom: var(--safe-bottom);
  }
  .bottom-nav a {
    flex: 1; text-align: center; padding: 8px 0 6px; font-size: 11px; color: var(--text-3);
    text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .bottom-nav a.active { color: var(--primary); }
  .bottom-nav .bn-icon { font-size: 20px; }
</style>
</head>
<body>
<div class="app-container">
  <div class="train-header">
<h1>🎓 知识资料库</h1>
<p>产品说明 · 分红解读 · 公司实力 · 知识卡</p>
  </div>

  <div class="filter-bar" id="filterBar"></div>
  <div class="course-grid" id="courseGrid"></div>

  <!-- 相关产品与资源（T095 交叉引用） -->
  <div class="rel-wrap">
    <div class="rel-title">📦 相关产品与资源</div>
    <div class="rel-grid">
      <a class="rel-card" href="intro-yingmanxin.html">💡 盈满鑫产品解读</a>
      <a class="rel-card" href="dividend.html">📈 红利实现率解读</a>
<a class="rel-card" href="sales-qa.html">💬 常见问题说明</a>
      <a class="rel-card" href="about-xinhua.html">🏢 认识新华</a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="index.html"><span class="bn-icon">🏠</span>首页</a>
    <a href="training.html" class="active"><span class="bn-icon">🎓</span>资料</a>
    <a href="sales-qa.html"><span class="bn-icon">💬</span>问答</a>
    <a href="dividend.html"><span class="bn-icon">📈</span>分红</a>
  </div>
</div>

<script>
const TRAINING_URL = "assets/data/training.json";
let ALL = [];

async function load() {
  try {
    const r = await fetch(TRAINING_URL);
    ALL = (await r.json()).courses || [];
  } catch (e) {
    document.getElementById("courseGrid").innerHTML =
      '<div class="empty">课程数据加载失败（需通过服务器或 GitHub Pages 访问）</div>';
    return;
  }
  renderChips();
  render(ALL);
}

function renderChips() {
  const cats = ["全部", ...new Set(ALL.map(c => c.category))];
  const bar = document.getElementById("filterBar");
  bar.innerHTML = cats.map((c, i) =>
    `<div class="filter-chip ${i === 0 ? "active" : ""}" data-cat="${c}">${c}</div>`).join("");
  bar.querySelectorAll(".filter-chip").forEach(ch => {
    ch.onclick = () => {
      bar.querySelectorAll(".filter-chip").forEach(x => x.classList.remove("active"));
      ch.classList.add("active");
      const cat = ch.dataset.cat;
      render(cat === "全部" ? ALL : ALL.filter(c => c.category === cat));
    };
  });
}

function render(list) {
  const grid = document.getElementById("courseGrid");
  if (!list.length) { grid.innerHTML = '<div class="empty">暂无该分类课程</div>'; return; }
  grid.innerHTML = list.map(c => `
    <div class="course-card">
      <img class="course-cover" src="${c.cover || "assets/preview/hongan-card.jpg"}" alt="${c.title}" loading="lazy">
      <div class="course-body">
        <div class="course-cat">${c.category}</div>
        <div class="course-title">${c.title}</div>
        <div class="course-meta">
          <span>📅 ${c.date}</span>
          <span>👤 ${c.instructor || "—"}</span>
        </div>
        <div class="course-tags">${(c.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}</div>
        <div class="course-actions">
          <a class="btn btn-primary btn-block" href="${c.link || c.page || "#"}">查看</a>
          ${c.ppt ? `<a class="btn btn-outline btn-block" href="${c.ppt}">原始资料</a>` : ""}
        </div>
      </div>
    </div>`).join("");
}

load();
</script>
</body>
</html>
